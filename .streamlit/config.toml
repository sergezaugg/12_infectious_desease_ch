[theme]
base = "dark"
font = "sans serif"
baseRadius = "large"

# ---------------------------
# Dark theme
# ---------------------------
[theme.dark]
primaryColor="#23a7e4"
backgroundColor="#000000"
secondaryBackgroundColor="#0E1117"
textColor="#ffffff"
linkColor='#0055cc'
borderColor = "#3B3F4A"

# ---------------------------
# Light theme
# ---------------------------
[theme.light]
primaryColor = "#1685c5"
